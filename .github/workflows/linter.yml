name: Lint Code Base

# Run checks on pushes to main and on Pull Request creation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Super-Linter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch full commit history for the linter to analyze changes correctly
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable linters that often cause false positives or require complex setup:
          VALIDATE_JSCPD: false # Copy/paste detector (often complains about template files)
          VALIDATE_PYTHON_MYPY: false # Python strict typing (better configured separately)